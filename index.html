<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lycée Professionnel Maritime Boulogne - Le Portel</title>
<style>
  :root{
    --accent:#1a73e8;--accent-soft:#e8f0fe;--bg:#f6f8fb;--card:#ffffff;
    --text:#1f2430;--muted:#98a2b3;--border:#e6e9ef;--radius:14px;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 16px rgba(16,24,40,.07);
    --success:#0f9d58;--warning:#f4b400;--danger:#d93025;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    width:100%;max-width:100%;overflow-x:hidden}

  .wrap{width:100%;max-width:1400px;margin:0 auto;padding:12px;overflow-x:hidden}

  .header{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px 14px;margin-bottom:14px;text-align:center;
    max-width:100%;word-wrap:break-word;
  }
  .header .banner{
    display:block;margin:0 auto 12px;
    max-width:600px;width:100%;height:auto;
  }
  .header h1{margin:0;font-size:18px;font-weight:700;line-height:1.3;word-wrap:break-word}
  .header .subtitle{margin:6px 0 0;font-size:13px;color:#667085;font-weight:500}

  .sortbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .sortbar label{font-size:13px;color:#475467;font-weight:500}
  .sortbar select{
    padding:8px 10px;border:1px solid var(--border);border-radius:8px;
    background:var(--card);font-size:14px;color:var(--text);
    outline:none;cursor:pointer;max-width:100%;flex:1 1 160px;
  }
  .sortbar .dir{
    padding:8px 10px;border:1px solid var(--border);border-radius:8px;
    background:var(--card);font-size:13px;cursor:pointer;white-space:nowrap;
  }

  /* Vue cartes */
  .cards{display:grid;grid-template-columns:1fr;gap:10px}
  .card{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:12px 14px;max-width:100%;word-wrap:break-word;
  }
  .card h3{margin:0 0 8px;font-size:15px;font-weight:600;color:var(--accent);word-break:break-word}
  .card .row{
    display:grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px dashed var(--border);
    font-size: 14px;
  }
  .card .row:last-child{border-bottom:none}
  .card .row .k{
    color:#475467;font-size:13.5px;word-break:break-word;
    min-width:0;line-height:1.3;
  }
  .card .row .v{
    text-align:right;font-weight:700;color:var(--accent);
    font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px;
  }
  .card .row .v.empty{color:var(--muted);font-weight:500}

  /* Vue tableau */
  .table-wrap{
    display:none;background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);
    overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;
  }
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:0}
  thead th{
    position:sticky;top:0;background:var(--accent);color:#fff;
    text-align:left;padding:10px 12px;font-weight:600;
    white-space:nowrap;cursor:pointer;user-select:none;
  }
  thead th:hover{background:#1558b0}
  thead th:not(:first-child){text-align:right}
  thead th .arrow{display:inline-block;margin-left:6px;opacity:.4;font-size:11px}
  thead th.sorted .arrow{opacity:1}
  tbody td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:top;word-break:break-word}
  tbody td:first-child{font-weight:600;color:#344054}
  tbody td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
  tbody td.empty{color:var(--muted);font-weight:400}
  tbody tr:nth-child(even){background:#fafbfd}
  tbody tr:hover{background:#eef4ff}

  /* Loader */
  .loading{
    text-align:center;padding:40px 16px;color:var(--muted);font-size:15px;
    display:flex;align-items:center;justify-content:center;gap:12px;
  }
  .loading .spin{
    width:18px;height:18px;border:2px solid var(--border);
    border-top-color:var(--accent);border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .empty-msg{text-align:center;padding:40px;color:var(--muted)}

  /* MODE MOBILE */
  body.layout-mobile .wrap{padding:14px}
  body.layout-mobile .header{padding:18px 16px 16px;margin-bottom:16px}
  body.layout-mobile .header h1{font-size:22px;line-height:1.3}
  body.layout-mobile .header .subtitle{font-size:15px;margin-top:8px}
  body.layout-mobile .header .banner{margin-bottom:14px}
  body.layout-mobile .sortbar{gap:10px;margin-bottom:16px}
  body.layout-mobile .sortbar label{font-size:15px}
  body.layout-mobile .sortbar select{font-size:16px;padding:10px 12px}
  body.layout-mobile .sortbar .dir{font-size:15px;padding:10px 12px}
  body.layout-mobile .cards{gap:12px}
  body.layout-mobile .card{padding:16px 18px}
  body.layout-mobile .card h3{font-size:18px;margin-bottom:14px}
  body.layout-mobile .card .row{grid-template-columns:1fr auto;gap:14px;padding:12px 0}
  body.layout-mobile .card .row .k{font-size:14.5px;line-height:1.35}
  body.layout-mobile .card .row .v{font-size:16px}

  /* MODE TABLETTE */
  body.layout-tablet .cards{grid-template-columns:repeat(2,1fr)}
  body.layout-tablet .wrap{padding:16px}
  body.layout-tablet .header{padding:22px 18px}
  body.layout-tablet .header h1{font-size:24px}
  body.layout-tablet .header .subtitle{font-size:15px}
  body.layout-tablet .card h3{font-size:17px}
  body.layout-tablet .card .row{font-size:15px}

  /* MODE DESKTOP */
  body.layout-desktop .wrap{padding:20px}
  body.layout-desktop .header{padding:28px 24px 24px}
  body.layout-desktop .header h1{font-size:24px}
  body.layout-desktop .header .subtitle{font-size:15px}
  body.layout-desktop .cards{display:none}
  body.layout-desktop .table-wrap{display:block}
  body.layout-desktop .sortbar{display:none}
</style>
</head>
<body>

<script>
  (function(){
    function applyLayout(){
      var w = Math.min(
        window.innerWidth || 9999,
        document.documentElement.clientWidth || 9999,
        screen.width || 9999
      );
      document.body.classList.remove('layout-mobile','layout-tablet','layout-desktop');
      if (w < 700)       document.body.classList.add('layout-mobile');
      else if (w < 1000) document.body.classList.add('layout-tablet');
      else               document.body.classList.add('layout-desktop');
    }
    applyLayout();
    window.addEventListener('resize', applyLayout);
    window.addEventListener('orientationchange', function(){
      setTimeout(applyLayout, 200);
    });
  })();
</script>

<div class="wrap">

  <header class="header">
    <img class="banner"
      src="https://www.lyceemaritime-boulogne.com/application/themes/theme_simpleo_coteo/images/logo-lycee-maritime-boulogne.jpg"
      alt="Lycée Maritime Boulogne">
    <h1>Lycée Professionnel Maritime Boulogne - Le Portel</h1>
    <p class="subtitle">Formations FC — Évaluation à chaud des formations</p>
  </header>

  <div class="loading" id="loading">
    <div class="spin"></div>
    <div>Chargement des données…</div>
  </div>

  <div class="sortbar" id="sortbar" style="display:none">
    <label for="sortSelect">Trier par :</label>
    <select id="sortSelect"></select>
    <button class="dir" id="sortDir" type="button">▲ Croissant</button>
  </div>

  <div class="cards" id="cards" style="display:none"></div>

  <div class="table-wrap" id="tableWrap" style="display:none">
    <table id="table"></table>
  </div>

  <div class="empty-msg" id="empty" style="display:none">Aucune donnée disponible</div>
</div>

<script>
  /* ============================================================
     ⚙️ CONFIGURATION
     ============================================================ */
  const API_URL = "https://script.google.com/macros/s/AKfycbziTiSbC36BjmwUSjJky6VJg91Amn1xCYc8fScu64qjbTHvVIDkfrc-G9O2NOCp_FrIhQ/exec";

  const CACHE_KEY = 'formations-cache-v2';
  const CACHE_MAX_AGE_MS = 5 * 60 * 1000; // 5 minutes

  /* ============================================================
     DOM
     ============================================================ */
  const $loading   = document.getElementById('loading');
  const $cards     = document.getElementById('cards');
  const $table     = document.getElementById('table');
  const $tableWrap = document.getElementById('tableWrap');
  const $empty     = document.getElementById('empty');
  const $sortbar   = document.getElementById('sortbar');
  const $select    = document.getElementById('sortSelect');
  const $dirBtn    = document.getElementById('sortDir');

  let DATA = { indicators: [], rows: [] };
  let sortKey = 'name';
  let sortAsc = true;

  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  /* ============================================================
     CACHE LOCAL
     ============================================================ */
  function lireCache(){
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (Date.now() - obj.time > CACHE_MAX_AGE_MS) return null;
      return obj.data;
    } catch(e){ return null; }
  }
  function ecrireCache(data){
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ time: Date.now(), data }));
    } catch(e){}
  }

  /* ============================================================
     TRI
     ============================================================ */
  function getValue(row, key){
    if (key === 'name') return row.name.toLowerCase();
    const i = parseInt(key.replace('col',''), 10);
    const c = row.cells[i];
    if (c.empty) return null;
    return c.num !== null ? c.num : c.value.toLowerCase();
  }
  function sortRows(rows){
    return rows.slice().sort((a, b) => {
      const va = getValue(a, sortKey), vb = getValue(b, sortKey);
      if (va === null && vb === null) return 0;
      if (va === null) return 1;
      if (vb === null) return -1;
      if (typeof va === 'number' && typeof vb === 'number'){
        return sortAsc ? va - vb : vb - va;
      }
      const sa = String(va), sb = String(vb);
      return sortAsc ? sa.localeCompare(sb,'fr') : sb.localeCompare(sa,'fr');
    });
  }

  /* ============================================================
     RENDU
     ============================================================ */
  function render(){
    if (!DATA.rows.length){
      $loading.style.display='none';
      $empty.style.display='block';
      return;
    }
    const rows = sortRows(DATA.rows);

    /* ---- Tableau desktop ---- */
    const thead = '<thead><tr>' +
      '<th data-key="name" class="'+(sortKey==='name'?'sorted':'')+'">Formation' +
      '<span class="arrow">'+(sortKey==='name'?(sortAsc?'▲':'▼'):'▲')+'</span></th>' +
      DATA.indicators.map((h, i) => {
        const k = 'col'+i;
        const cls = sortKey===k ? 'sorted' : '';
        const arr = sortKey===k ? (sortAsc?'▲':'▼') : '▲';
        return '<th data-key="'+k+'" class="'+cls+'">'+esc(h)+
               '<span class="arrow">'+arr+'</span></th>';
      }).join('') + '</tr></thead>';

    const tbody = '<tbody>' + rows.map(r =>
      '<tr><td>'+esc(r.name)+'</td>' +
      r.cells.map(c => '<td class="'+(c.empty?'empty':'')+'">'+esc(c.value)+'</td>').join('') +
      '</tr>'
    ).join('') + '</tbody>';

    $table.innerHTML = thead + tbody;

    /* ---- Cartes mobile ---- */
    $cards.innerHTML = rows.map(r => {
      const items = DATA.indicators.map((label, i) => {
        const c = r.cells[i];
        return '<div class="row"><span class="k">'+esc(label)+'</span>' +
               '<span class="v'+(c.empty?' empty':'')+'">'+esc(c.value)+'</span></div>';
      }).join('');
      return '<div class="card"><h3>'+esc(r.name)+'</h3>'+items+'</div>';
    }).join('');

    /* ---- Événements tri (desktop) ---- */
    $table.querySelectorAll('thead th').forEach(th => {
      th.addEventListener('click', () => {
        const k = th.dataset.key;
        if (k === sortKey) sortAsc = !sortAsc;
        else { sortKey = k; sortAsc = true; }
        render();
      });
    });

    /* ---- Affichage ---- */
    $loading.style.display='none';
    $cards.style.display='grid';
    $tableWrap.style.display='block';
    $sortbar.style.display='flex';
    $empty.style.display='none';

    if ($dirBtn) $dirBtn.textContent = sortAsc ? '▲ Croissant' : '▼ Décroissant';
  }

  /* ============================================================
     MENU DE TRI (mobile + tablette)
     ============================================================ */
  function initSortBar(){
    if (!$select) return;
    $select.innerHTML = '';
    const cols = [{ key: 'name', label: 'Formation' },
      ...DATA.indicators.map((h, i) => ({ key: 'col'+i, label: h }))];
    cols.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.key;
      opt.textContent = c.label;
      $select.appendChild(opt);
    });
    $select.value = sortKey;

    if (!$select.dataset.bound){
      $select.addEventListener('change', () => {
        sortKey = $select.value;
        sortAsc = true;
        render();
      });
      $select.dataset.bound = '1';
    }
    if ($dirBtn && !$dirBtn.dataset.bound){
      $dirBtn.addEventListener('click', () => {
        sortAsc = !sortAsc;
        render();
      });
      $dirBtn.dataset.bound = '1';
    }
  }

  /* ============================================================
     CHARGEMENT DES DONNÉES
     ============================================================ */
  async function chargerDonnees(){
    /* 1) Affichage immédiat si cache récent */
    const cached = lireCache();
    if (cached && cached.rows && cached.rows.length){
      DATA = cached;
      initSortBar();
      render();
    }

    /* 2) Rafraîchissement via l'API */
    try {
      const response = await fetch(API_URL, { cache: 'no-store' });
      if (!response.ok) throw new Error('Erreur réseau');
      const data = await response.json();

      if (!data || data.error || !Array.isArray(data.indicators) || !Array.isArray(data.rows)){
        console.error("Réponse API invalide:", data);
        if (!cached){
          $loading.style.display = 'none';
          $empty.textContent = "Erreur de chargement des données.";
          $empty.style.display = 'block';
        }
        return;
      }

      DATA = data;
      ecrireCache(data);
      initSortBar();
      render();

    } catch (error) {
      console.error("Erreur de chargement:", error);
      if (!cached){
        $loading.style.display = 'none';
        $empty.textContent = "Impossible de charger les données.";
        $empty.style.display = 'block';
      }
    }
  }

  chargerDonnees();
</script>
</body>
</html>
