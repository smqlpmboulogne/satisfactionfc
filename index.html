<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Évaluation à chaud des formations fc — Lycée Maritime Boulogne</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --marine:#1e3a5f;--marine-fonce:#152a45;--ocean:#2c5a8c;
    --azur:#4a90c4;--azur-clair:#7fb3d9;--anis:#a4c639;
    --ecume:#f0f5fa;--ecume-2:#e3edf5;
    --card:#ffffff;--text:#1a2a3a;--muted:#7a8fa6;--border:#d8e3ed;
    --radius:10px;
    --shadow:0 1px 2px rgba(30,58,95,.06), 0 6px 16px rgba(30,58,95,.08);
    --shadow-hover:0 6px 12px rgba(30,58,95,.10), 0 16px 32px rgba(30,58,95,.12);
    --success:#5fa02c;--success-2:#4a8a1f;
    --warning:#e8a63c;--warning-2:#c88a1c;
    --danger:#c93e3e;--danger-2:#a52f2f;
  }
  *{box-sizing:border-box}
  html, body {
    margin:0; padding:0;
    background: linear-gradient(180deg, #e8f1f9 0%, #f0f5fa 400px, #f5f9fc 100%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    width:100%; max-width:100%; overflow-x:hidden;
    min-height:100vh;
  }
  .wrap{width:100%;max-width:1200px;margin:0 auto;padding:12px;overflow-x:hidden}

  /* En-tête maritime compact */
  .header{
    background: linear-gradient(135deg, var(--marine) 0%, var(--ocean) 100%);
    border:1px solid var(--marine-fonce);
    border-radius:var(--radius);
    box-shadow:0 8px 24px rgba(30,58,95,.20);
    padding:14px 16px;
    margin-bottom:16px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .header::after{
    content:'';
    position:absolute;left:0;right:0;bottom:-1px;height:24px;
    background: radial-gradient(ellipse at 50% 100%, transparent 60%, rgba(255,255,255,.08) 61%);
    pointer-events:none;
  }
  .header .banner{
    display:block;
    margin:0 auto 6px;
    max-width:260px;
    width:100%;
    height:auto;
  }
  .header h1{
    margin:0;
    font-size:16px;
    font-weight:700;
    line-height:1.3;
    color:#ffffff;
    letter-spacing:-0.3px;
  }
  .header .subtitle{
    margin:4px 0 0;
    font-size:13px;
    color:#b8d2e8;
    font-weight:500;
  }
  .header .updated{
    margin-top:10px;
    font-size:11.5px;
    color:#d0e0ee;
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:3px 10px;
    background:rgba(255,255,255,.12);
    border-radius:14px;
    backdrop-filter:blur(4px);
  }
  .header .updated .dot{
    display:inline-block;
    width:6px;height:6px;border-radius:50%;
    background:var(--anis);
    box-shadow:0 0 0 3px rgba(164,198,57,.30);
  }

  /* Grille de cartes */
  .cards-grid{
    display:grid;grid-template-columns:1fr;gap:12px;
  }

  /* Cartes */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px 18px;
    display:flex;flex-direction:column;gap:8px;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute;top:0;left:0;bottom:0;
    width:4px;
    background:var(--azur);
    transition:background .2s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:var(--shadow-hover);
    border-color:var(--azur-clair);
  }
  .card.high::before{background:var(--success)}
  .card.mid::before{background:var(--warning)}
  .card.low::before{background:var(--danger)}
  .card.unknown::before{background:var(--muted)}

  .card h3{
    margin:0;
    font-size:14.5px;
    font-weight:600;
    color:var(--marine);
    word-break:break-word;
    line-height:1.35;
  }
  .card .value{
    font-size:32px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    letter-spacing:-1px;
    line-height:1.05;
    color:var(--azur);
    transition:color .2s ease;
  }
  .card .bar{
    width:100%;height:6px;
    background:var(--ecume-2);
    border-radius:3px;
    overflow:hidden;margin-top:2px;
  }
  .card .bar span{
    display:block;height:100%;border-radius:3px;
    background:linear-gradient(90deg, var(--azur), var(--ocean));
    transition:width .6s cubic-bezier(.4,0,.2,1);
  }

  .card.high .value{color:var(--success)}
  .card.high .bar span{background:linear-gradient(90deg, var(--anis), var(--success-2))}
  .card.mid .value{color:var(--warning)}
  .card.mid .bar span{background:linear-gradient(90deg, #f0c060, var(--warning-2))}
  .card.low .value{color:var(--danger)}
  .card.low .bar span{background:linear-gradient(90deg, #e06060, var(--danger-2))}
  .card.unknown .value{color:var(--muted);font-weight:500}

  /* Loader */
  .loading{
    text-align:center;padding:50px 16px;color:var(--muted);font-size:15px;
    display:flex;align-items:center;justify-content:center;gap:12px;
  }
  .loading .spin{
    width:22px;height:22px;
    border:2px solid var(--border);
    border-top-color:var(--azur);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .empty-msg{
    text-align:center;padding:50px 16px;color:var(--muted);font-size:14px;
  }

  /* Pied de page */
  footer.foot{
    text-align:center;
    padding:24px 16px 16px;
    font-size:12px;
    color:var(--muted);
    line-height:1.4;
  }
  footer.foot p{margin:0}
  footer.foot p + p{margin-top:3px}
  footer.foot .brand{
    color:var(--marine);font-weight:600;letter-spacing:.3px;
  }
  footer.foot .sep{
    display:inline-block;margin:0 5px;color:var(--azur-clair);
  }
  footer.foot .mention{
    font-style:italic;
    font-size:11px;
    color:var(--muted);
    opacity:.85;
  }

  /* Animation d'apparition */
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:translateY(0)}
  }
  .card{animation:fadeUp .35s ease backwards}
  .card:nth-child(1){animation-delay:.02s}
  .card:nth-child(2){animation-delay:.04s}
  .card:nth-child(3){animation-delay:.06s}
  .card:nth-child(4){animation-delay:.08s}
  .card:nth-child(5){animation-delay:.10s}
  .card:nth-child(6){animation-delay:.12s}
  .card:nth-child(7){animation-delay:.14s}
  .card:nth-child(8){animation-delay:.16s}
  .card:nth-child(9){animation-delay:.18s}
  .card:nth-child(10){animation-delay:.20s}

  /* RESPONSIVE */
  @media (min-width:600px){
    .wrap{padding:16px}
    .cards-grid{grid-template-columns:repeat(2,1fr);gap:12px}
    .header{padding:16px 20px;margin-bottom:18px}
    .header .banner{max-width:220px;margin-bottom:8px}
    .header h1{font-size:18px}
    .header .subtitle{font-size:13.5px}
  }
  @media (min-width:900px){
    .wrap{padding:20px}
    .cards-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
    .header{padding:18px 24px;margin-bottom:20px}
    .header .banner{max-width:260px;margin-bottom:8px}
    .header h1{font-size:20px}
    .header .subtitle{font-size:14px}
    .card{padding:20px 20px}
    .card .value{font-size:36px}
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="header">
    <img class="banner"
      src="https://www.lyceemaritime-boulogne.com/application/themes/theme_simpleo_coteo/images/logo-lycee-maritime-boulogne.jpg"
      alt="Lycée Maritime Boulogne">
    <h1>Évaluation à chaud des formations fc</h1>
    <p class="subtitle">Lycée Professionnel Maritime Boulogne - Le Portel</p>
    <div class="updated" id="updated" style="display:none">
      <span class="dot"></span>
      <span>Données mises à jour le <span id="updated-date">…</span></span>
    </div>
  </header>

  <div class="loading" id="loading">
    <div class="spin"></div>
    <div>Chargement des données…</div>
  </div>

  <div class="cards-grid" id="grid" style="display:none"></div>
  <div class="empty-msg" id="empty" style="display:none">Aucune donnée disponible</div>

  <footer class="foot">
    <p>
      Conception et réalisation : <span class="brand">ZEG</span>
      <span class="sep">—</span>
      Lycée Maritime Boulogne, <span id="year">2026</span>
    </p>
    <p class="mention">
      Projet réalisé dans le cadre du pacte enseignant
    </p>
  </footer>
</div>

<script>
  /* ============================================================
     1) ANNÉE EN COURS
     ============================================================ */
  document.getElementById('year').textContent = new Date().getFullYear();

  /* ============================================================
     2) UTILITAIRES
     ============================================================ */
  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function parseCSV(text){
    const rows = [];
    let cur = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++){
      const c = text[i];
      if (inQuotes){
        if (c === '"'){
          if (text[i+1] === '"'){ field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ','){ cur.push(field); field = ''; }
        else if (c === '\n'){ cur.push(field); rows.push(cur); cur = []; field = ''; }
        else if (c === '\r'){ }
        else field += c;
      }
    }
    if (field !== '' || cur.length){ cur.push(field); rows.push(cur); }
    return rows.filter(r => r.some(c => c.trim() !== ''));
  }

  function toPercent(v){
    if (!v) return null;
    const s = String(v).trim().replace('%','').replace(',','.');
    const n = parseFloat(s);
    if (isNaN(n)) return null;
    return n <= 1 ? n * 100 : n;
  }

  function level(n){
    if (n == null) return 'unknown';
    if (n >= 75) return 'high';
    if (n >= 50) return 'mid';
    return 'low';
  }

  /* ============================================================
     3) RENDU
     ============================================================ */
  function render(rows){
    if (!rows.length){
      document.getElementById('loading').style.display = 'none';
      document.getElementById('empty').style.display = 'block';
      return;
    }

    document.getElementById('grid').innerHTML = rows.map(r => {
      const lvl = level(r.satisfaction);
      const pct = r.satisfaction != null ? Math.max(0, Math.min(100, r.satisfaction)) : 0;
      const bar = r.satisfaction != null
        ? '<div class="bar"><span style="width:'+pct+'%"></span></div>' : '';
      const aff = r.satisfaction != null
        ? r.satisfaction.toFixed(1).replace('.',',') + ' %'
        : '—';

      return '<div class="card '+lvl+'">' +
               '<h3>'+esc(r.name)+'</h3>' +
               '<div class="value">'+aff+'</div>' +
               bar +
             '</div>';
    }).join('');

    document.getElementById('loading').style.display = 'none';
    document.getElementById('grid').style.display = 'grid';
    document.getElementById('empty').style.display = 'none';
  }

  /* ============================================================
     4) DATE
     ============================================================ */
  async function chargerDate(){
    try {
      const r = await fetch('last-update.txt?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const txt = (await r.text()).trim();
      const d = new Date(txt);
      if (isNaN(d)) return;
      const opts = { day:'2-digit', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' };
      document.getElementById('updated-date').textContent = d.toLocaleString('fr-FR', opts);
      document.getElementById('updated').style.display = 'inline-flex';
    } catch(e){}
  }

  /* ============================================================
     5) CHARGEMENT
     ============================================================ */
  async function chargerTout(){
    try {
      const response = await fetch('formations.csv?t=' + Date.now(), { cache: 'no-store' });
      if (!response.ok) throw new Error('Erreur ' + response.status);
      const csv = await response.text();
      const rows = parseCSV(csv);

      if (rows.length < 2) throw new Error('CSV vide');

      const headers = rows[0].map(h => h.trim());

      const idxRep = headers.findIndex(h => /réponse aux attentes/i.test(h));
      const idxObj = headers.findIndex(h => /atteinte des objectifs/i.test(h));
      const idxUti = headers.findIndex(h => /utilisation compétences/i.test(h));
      const idxQua = headers.findIndex(h => /qualité.*animation/i.test(h));

      const data = rows.slice(1)
        .filter(r => r[0] && r[0].trim() !== '')
        .map(r => {
          const name = r[0].trim();
          const vals = [
            idxRep >= 0 ? toPercent(r[idxRep]) : null,
            idxObj >= 0 ? toPercent(r[idxObj]) : null,
            idxUti >= 0 ? toPercent(r[idxUti]) : null,
            idxQua >= 0 ? toPercent(r[idxQua]) : null
          ].filter(v => v != null);

          const satisfaction = vals.length
            ? vals.reduce((a,b) => a+b, 0) / vals.length
            : null;

          return { name, satisfaction };
        })
        .filter(r => r.satisfaction != null)
        .sort((a, b) => b.satisfaction - a.satisfaction);

      render(data);
      chargerDate();

    } catch (e) {
      console.error("Erreur chargement:", e);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('empty').textContent = "Impossible de charger les données : " + e.message;
      document.getElementById('empty').style.display = 'block';
    }
  }

  chargerTout();
</script>
</body>
</html>
