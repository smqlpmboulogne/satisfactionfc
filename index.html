<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taux de satisfaction — Lycée Maritime Boulogne</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --accent:#1a73e8;--bg:#f6f8fb;--card:#ffffff;
    --text:#1f2430;--muted:#98a2b3;--border:#e6e9ef;--radius:14px;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 16px rgba(16,24,40,.07);
    --success:#0f9d58;--warning:#f4b400;--danger:#d93025;
  }
  *{box-sizing:border-box}
  html, body {
    margin:0; padding:0;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    width:100%; max-width:100%; overflow-x:hidden;
  }
  .wrap{width:100%;max-width:1200px;margin:0 auto;padding:12px;overflow-x:hidden}

  .header{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px 14px;margin-bottom:14px;text-align:center;
  }
  .header .banner{display:block;margin:0 auto 12px;max-width:600px;width:100%;height:auto}
  .header h1{margin:0;font-size:18px;font-weight:700;line-height:1.3}
  .header .subtitle{margin:6px 0 0;font-size:13px;color:#667085;font-weight:500}
  .header .updated{
    margin-top:10px;font-size:12px;color:#98a2b3;
    display:inline-flex;align-items:center;gap:6px;
  }
  .header .updated .dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--success);
  }

  .cards-grid{
    display:grid;grid-template-columns:1fr;gap:12px;
  }

  .card{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px 18px;display:flex;flex-direction:column;gap:8px;
    transition:transform .15s, box-shadow .15s;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(16,24,40,.08),0 12px 28px rgba(16,24,40,.10)}
  .card h3{margin:0;font-size:15px;font-weight:600;color:#344054;word-break:break-word}
  .card .value{
    font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;
    letter-spacing:-0.5px;line-height:1.1;
  }
  .card .bar{width:100%;height:6px;background:#eef1f6;border-radius:3px;overflow:hidden}
  .card .bar span{display:block;height:100%;border-radius:3px;transition:width .4s ease}

  .card.high .value{color:var(--success)}
  .card.high .bar span{background:var(--success)}
  .card.mid .value{color:var(--warning)}
  .card.mid .bar span{background:var(--warning)}
  .card.low .value{color:var(--danger)}
  .card.low .bar span{background:var(--danger)}
  .card.unknown .value{color:var(--muted);font-weight:500}

  .loading{
    text-align:center;padding:40px 16px;color:var(--muted);font-size:15px;
    display:flex;align-items:center;justify-content:center;gap:12px;
  }
  .loading .spin{
    width:20px;height:20px;border:2px solid var(--border);
    border-top-color:var(--accent);border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .empty-msg{text-align:center;padding:40px;color:var(--muted);font-size:14px}

  footer.foot{
    text-align:center;padding:24px 16px 12px;
    font-size:12px;color:#98a2b3;
  }

  /* RESPONSIVE */
  @media (min-width:600px){
    .wrap{padding:16px}
    .cards-grid{grid-template-columns:repeat(2,1fr);gap:14px}
    .header{padding:22px 18px}
    .header h1{font-size:22px}
  }
  @media (min-width:900px){
    .wrap{padding:20px}
    .cards-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
    .header{padding:28px 24px}
    .header h1{font-size:24px}
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="header">
    <img class="banner"
      src="https://www.lyceemaritime-boulogne.com/application/themes/theme_simpleo_coteo/images/logo-lycee-maritime-boulogne.jpg"
      alt="Lycée Maritime Boulogne">
    <h1>Lycée Professionnel Maritime Boulogne - Le Portel</h1>
    <p class="subtitle">Taux de satisfaction par formation</p>
    <div class="updated" id="updated" style="display:none">
      <span class="dot"></span>
      <span>Données mises à jour le <span id="updated-date">…</span></span>
    </div>
  </header>

  <div class="loading" id="loading">
    <div class="spin"></div>
    <div>Chargement des données…</div>
  </div>

  <div class="cards-grid" id="grid" style="display:none"></div>
  <div class="empty-msg" id="empty" style="display:none">Aucune donnée disponible</div>

  <footer class="foot">
    Source : Google Sheets — synchronisation automatique.
  </footer>
</div>

<script>
  /* ============================================================
     1) UTILITAIRES
     ============================================================ */
  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function parseCSV(text){
    const rows = [];
    let cur = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++){
      const c = text[i];
      if (inQuotes){
        if (c === '"'){
          if (text[i+1] === '"'){ field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ','){ cur.push(field); field = ''; }
        else if (c === '\n'){ cur.push(field); rows.push(cur); cur = []; field = ''; }
        else if (c === '\r'){ }
        else field += c;
      }
    }
    if (field !== '' || cur.length){ cur.push(field); rows.push(cur); }
    return rows.filter(r => r.some(c => c.trim() !== ''));
  }

  function toPercent(v){
    if (!v) return null;
    const s = String(v).trim().replace('%','').replace(',','.');
    const n = parseFloat(s);
    if (isNaN(n)) return null;
    return n <= 1 ? n * 100 : n;
  }

  function level(n){
    if (n == null) return 'unknown';
    if (n >= 75) return 'high';
    if (n >= 50) return 'mid';
    return 'low';
  }

  /* ============================================================
     2) RENDU — sans le nombre de réponses
     ============================================================ */
  function render(rows){
    if (!rows.length){
      document.getElementById('loading').style.display = 'none';
      document.getElementById('empty').style.display = 'block';
      return;
    }

    document.getElementById('grid').innerHTML = rows.map(r => {
      const lvl = level(r.satisfaction);
      const pct = r.satisfaction != null ? Math.max(0, Math.min(100, r.satisfaction)) : 0;
      const bar = r.satisfaction != null
        ? '<div class="bar"><span style="width:'+pct+'%"></span></div>' : '';
      const aff = r.satisfaction != null
        ? r.satisfaction.toFixed(1).replace('.',',') + ' %'
        : '—';

      return '<div class="card '+lvl+'">' +
               '<h3>'+esc(r.name)+'</h3>' +
               '<div class="value">'+aff+'</div>' +
               bar +
             '</div>';
    }).join('');

    document.getElementById('loading').style.display = 'none';
    document.getElementById('grid').style.display = 'grid';
    document.getElementById('empty').style.display = 'none';
  }

  /* ============================================================
     3) DATE
     ============================================================ */
  async function chargerDate(){
    try {
      const r = await fetch('last-update.txt?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const txt = (await r.text()).trim();
      const d = new Date(txt);
      if (isNaN(d)) return;
      const opts = { day:'2-digit', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' };
      document.getElementById('updated-date').textContent = d.toLocaleString('fr-FR', opts);
      document.getElementById('updated').style.display = 'inline-flex';
    } catch(e){}
  }

  /* ============================================================
     4) CHARGEMENT
     ============================================================ */
  async function chargerTout(){
    try {
      const response = await fetch('formations.csv?t=' + Date.now(), { cache: 'no-store' });
      if (!response.ok) throw new Error('Erreur ' + response.status);
      const csv = await response.text();
      const rows = parseCSV(csv);

      if (rows.length < 2) throw new Error('CSV vide');

      const headers = rows[0].map(h => h.trim());

      const idxRep = headers.findIndex(h => /réponse aux attentes/i.test(h));
      const idxObj = headers.findIndex(h => /atteinte des objectifs/i.test(h));
      const idxUti = headers.findIndex(h => /utilisation compétences/i.test(h));
      const idxQua = headers.findIndex(h => /qualité.*animation/i.test(h));

      const data = rows.slice(1)
        .filter(r => r[0] && r[0].trim() !== '')
        .map(r => {
          const name = r[0].trim();
          const vals = [
            idxRep >= 0 ? toPercent(r[idxRep]) : null,
            idxObj >= 0 ? toPercent(r[idxObj]) : null,
            idxUti >= 0 ? toPercent(r[idxUti]) : null,
            idxQua >= 0 ? toPercent(r[idxQua]) : null
          ].filter(v => v != null);

          const satisfaction = vals.length
            ? vals.reduce((a,b) => a+b, 0) / vals.length
            : null;

          return { name, satisfaction };
        })
        .filter(r => r.satisfaction != null)
        .sort((a, b) => b.satisfaction - a.satisfaction);

      render(data);
      chargerDate();

    } catch (e) {
      console.error("Erreur chargement:", e);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('empty').textContent = "Impossible de charger les données : " + e.message;
      document.getElementById('empty').style.display = 'block';
    }
  }

  chargerTout();
</script>
</body>
</html>
