<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taux de satisfaction — Lycée Maritime Boulogne</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --accent:#1a73e8;
    --accent-dark:#1558b0;
    --bg:#f6f8fb;
    --bg-gradient-1:#eef3fa;
    --bg-gradient-2:#f9fbfd;
    --card:#ffffff;
    --text:#1f2430;
    --muted:#98a2b3;
    --border:#e6e9ef;
    --radius:14px;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 16px rgba(16,24,40,.07);
    --shadow-hover:0 6px 12px rgba(16,24,40,.08),0 16px 32px rgba(16,24,40,.10);
    --success:#0f9d58;
    --warning:#f4b400;
    --danger:#d93025;
  }
  *{box-sizing:border-box}
  html, body {
    margin:0; padding:0;
    background: linear-gradient(180deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 400px, var(--bg) 100%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    width:100%; max-width:100%; overflow-x:hidden;
    min-height:100vh;
  }
  .wrap{width:100%;max-width:1200px;margin:0 auto;padding:12px;overflow-x:hidden}

  /* En-tête */
  .header{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px 14px;margin-bottom:18px;text-align:center;
    transition:box-shadow .25s ease;
  }
  .header .banner{display:block;margin:0 auto 14px;max-width:520px;width:100%;height:auto}
  .header h1{
    margin:0;font-size:18px;font-weight:700;line-height:1.3;
    color:#1f2430;letter-spacing:-0.3px;
  }
  .header .subtitle{
    margin:8px 0 0;font-size:14px;color:#667085;font-weight:500;
  }
  .header .updated{
    margin-top:12px;font-size:12px;color:#98a2b3;
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 10px;background:#f2f6fb;border-radius:20px;
  }
  .header .updated .dot{
    display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--success);
    box-shadow:0 0 0 3px rgba(15,157,88,.15);
  }

  /* Grille */
  .cards-grid{
    display:grid;grid-template-columns:1fr;gap:14px;
  }

  /* Cartes */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px 20px;
    display:flex;flex-direction:column;gap:10px;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute;top:0;left:0;bottom:0;
    width:4px;
    background:transparent;
    transition:background .2s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:var(--shadow-hover);
    border-color:#d8e3f5;
  }
  .card.high::before{background:var(--success)}
  .card.mid::before{background:var(--warning)}
  .card.low::before{background:var(--danger)}
  .card.unknown::before{background:var(--muted)}

  .card h3{
    margin:0;font-size:15px;font-weight:600;
    color:#344054;word-break:break-word;line-height:1.35;
  }
  .card .value{
    font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;
    letter-spacing:-1px;line-height:1.05;
    transition:color .2s ease;
  }
  .card .bar{
    width:100%;height:6px;background:#eef1f6;border-radius:3px;
    overflow:hidden;margin-top:2px;
  }
  .card .bar span{
    display:block;height:100%;border-radius:3px;
    transition:width .6s cubic-bezier(.4,0,.2,1);
  }

  .card.high .value{color:var(--success)}
  .card.high .bar span{background:linear-gradient(90deg,#0f9d58,#0c7d47)}
  .card.mid .value{color:var(--warning)}
  .card.mid .bar span{background:linear-gradient(90deg,#f4b400,#d99a00)}
  .card.low .value{color:var(--danger)}
  .card.low .bar span{background:linear-gradient(90deg,#d93025,#a82319)}
  .card.unknown .value{color:var(--muted);font-weight:500}

  /* Loader */
  .loading{
    text-align:center;padding:60px 16px;color:var(--muted);font-size:15px;
    display:flex;align-items:center;justify-content:center;gap:12px;
  }
  .loading .spin{
    width:22px;height:22px;border:2px solid var(--border);
    border-top-color:var(--accent);border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .empty-msg{
    text-align:center;padding:60px 16px;color:var(--muted);font-size:14px;
  }

  /* Pied de page */
  footer.foot{
    text-align:center;padding:32px 16px 20px;
    font-size:12px;color:#98a2b3;
    line-height:1.6;
  }
  footer.foot .brand{
    color:#667085;font-weight:600;letter-spacing:.3px;
  }
  footer.foot .sep{
    display:inline-block;margin:0 6px;color:#d0d5dd;
  }

  /* Animation d'apparition des cartes */
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:translateY(0)}
  }
  .card{
    animation:fadeUp .35s ease backwards;
  }
  .card:nth-child(1){animation-delay:.02s}
  .card:nth-child(2){animation-delay:.04s}
  .card:nth-child(3){animation-delay:.06s}
  .card:nth-child(4){animation-delay:.08s}
  .card:nth-child(5){animation-delay:.10s}
  .card:nth-child(6){animation-delay:.12s}
  .card:nth-child(7){animation-delay:.14s}
  .card:nth-child(8){animation-delay:.16s}
  .card:nth-child(9){animation-delay:.18s}
  .card:nth-child(10){animation-delay:.20s}

  /* RESPONSIVE */
  @media (min-width:600px){
    .wrap{padding:16px}
    .cards-grid{grid-template-columns:repeat(2,1fr);gap:14px}
    .header{padding:24px 20px}
    .header h1{font-size:22px}
    .header .subtitle{font-size:15px}
  }
  @media (min-width:900px){
    .wrap{padding:24px}
    .cards-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
    .header{padding:32px 24px;margin-bottom:24px}
    .header h1{font-size:26px}
    .card{padding:22px 22px}
    .card .value{font-size:38px}
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="header">
    <img class="banner"
      src="https://www.lyceemaritime-boulogne.com/application/themes/theme_simpleo_coteo/images/logo-lycee-maritime-boulogne.jpg"
      alt="Lycée Maritime Boulogne">
    <h1>Lycée Professionnel Maritime Boulogne - Le Portel</h1>
    <p class="subtitle">Taux de satisfaction par formation</p>
    <div class="updated" id="updated" style="display:none">
      <span class="dot"></span>
      <span>Données mises à jour le <span id="updated-date">…</span></span>
    </div>
  </header>

  <div class="loading" id="loading">
    <div class="spin"></div>
    <div>Chargement des données…</div>
  </div>

  <div class="cards-grid" id="grid" style="display:none"></div>
  <div class="empty-msg" id="empty" style="display:none">Aucune donnée disponible</div>

  <footer class="foot">
    <p>
      <span class="brand">ZEG</span>
      <span class="sep">•</span>
      <span>Synchronisation automatique</span>
      <span class="sep">•</span>
      <span>© <span id="year">2026</span></span>
    </p>
  </footer>
</div>

<script>
  /* ============================================================
     1) ANNÉE EN COURS
     ============================================================ */
  document.getElementById('year').textContent = new Date().getFullYear();

  /* ============================================================
     2) UTILITAIRES
     ============================================================ */
  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function parseCSV(text){
    const rows = [];
    let cur = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++){
      const c = text[i];
      if (inQuotes){
        if (c === '"'){
          if (text[i+1] === '"'){ field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ','){ cur.push(field); field = ''; }
        else if (c === '\n'){ cur.push(field); rows.push(cur); cur = []; field = ''; }
        else if (c === '\r'){ }
        else field += c;
      }
    }
    if (field !== '' || cur.length){ cur.push(field); rows.push(cur); }
    return rows.filter(r => r.some(c => c.trim() !== ''));
  }

  function toPercent(v){
    if (!v) return null;
    const s = String(v).trim().replace('%','').replace(',','.');
    const n = parseFloat(s);
    if (isNaN(n)) return null;
    return n <= 1 ? n * 100 : n;
  }

  function level(n){
    if (n == null) return 'unknown';
    if (n >= 75) return 'high';
    if (n >= 50) return 'mid';
    return 'low';
  }

  /* ============================================================
     3) RENDU
     ============================================================ */
  function render(rows){
    if (!rows.length){
      document.getElementById('loading').style.display = 'none';
      document.getElementById('empty').style.display = 'block';
      return;
    }

    document.getElementById('grid').innerHTML = rows.map(r => {
      const lvl = level(r.satisfaction);
      const pct = r.satisfaction != null ? Math.max(0, Math.min(100, r.satisfaction)) : 0;
      const bar = r.satisfaction != null
        ? '<div class="bar"><span style="width:'+pct+'%"></span></div>' : '';
      const aff = r.satisfaction != null
        ? r.satisfaction.toFixed(1).replace('.',',') + ' %'
        : '—';

      return '<div class="card '+lvl+'">' +
               '<h3>'+esc(r.name)+'</h3>' +
               '<div class="value">'+aff+'</div>' +
               bar +
             '</div>';
    }).join('');

    document.getElementById('loading').style.display = 'none';
    document.getElementById('grid').style.display = 'grid';
    document.getElementById('empty').style.display = 'none';
  }

  /* ============================================================
     4) DATE
     ============================================================ */
  async function chargerDate(){
    try {
      const r = await fetch('last-update.txt?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const txt = (await r.text()).trim();
      const d = new Date(txt);
      if (isNaN(d)) return;
      const opts = { day:'2-digit', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' };
      document.getElementById('updated-date').textContent = d.toLocaleString('fr-FR', opts);
      document.getElementById('updated').style.display = 'inline-flex';
    } catch(e){}
  }

  /* ============================================================
     5) CHARGEMENT
     ============================================================ */
  async function chargerTout(){
    try {
      const response = await fetch('formations.csv?t=' + Date.now(), { cache: 'no-store' });
      if (!response.ok) throw new Error('Erreur ' + response.status);
      const csv = await response.text();
      const rows = parseCSV(csv);

      if (rows.length < 2) throw new Error('CSV vide');

      const headers = rows[0].map(h => h.trim());

      const idxRep = headers.findIndex(h => /réponse aux attentes/i.test(h));
      const idxObj = headers.findIndex(h => /atteinte des objectifs/i.test(h));
      const idxUti = headers.findIndex(h => /utilisation compétences/i.test(h));
      const idxQua = headers.findIndex(h => /qualité.*animation/i.test(h));

      const data = rows.slice(1)
        .filter(r => r[0] && r[0].trim() !== '')
        .map(r => {
          const name = r[0].trim();
          const vals = [
            idxRep >= 0 ? toPercent(r[idxRep]) : null,
            idxObj >= 0 ? toPercent(r[idxObj]) : null,
            idxUti >= 0 ? toPercent(r[idxUti]) : null,
            idxQua >= 0 ? toPercent(r[idxQua]) : null
          ].filter(v => v != null);

          const satisfaction = vals.length
            ? vals.reduce((a,b) => a+b, 0) / vals.length
            : null;

          return { name, satisfaction };
        })
        .filter(r => r.satisfaction != null)
        .sort((a, b) => b.satisfaction - a.satisfaction);

      render(data);
      chargerDate();

    } catch (e) {
      console.error("Erreur chargement:", e);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('empty').textContent = "Impossible de charger les données : " + e.message;
      document.getElementById('empty').style.display = 'block';
    }
  }

  chargerTout();
</script>
</body>
</html>
