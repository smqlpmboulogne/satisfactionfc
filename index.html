<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lycée Professionnel Maritime Boulogne - Le Portel</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --accent:#1a73e8;--accent-soft:#e8f0fe;--bg:#f6f8fb;--card:#ffffff;
    --text:#1f2430;--muted:#98a2b3;--border:#e6e9ef;--radius:14px;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 16px rgba(16,24,40,.07);
    --success:#0f9d58;--warning:#f4b400;--danger:#d93025;
  }
  *{box-sizing:border-box}
  html, body {
    margin:0; padding:0;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    width:100%; max-width:100%; overflow-x:hidden;
  }
  .wrap{width:100%;max-width:1400px;margin:0 auto;padding:12px;overflow-x:hidden}
  .header{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px 14px;margin-bottom:14px;text-align:center;
  }
  .header .banner{display:block;margin:0 auto 12px;max-width:600px;width:100%;height:auto}
  .header h1{margin:0;font-size:18px;font-weight:700;line-height:1.3}
  .header .subtitle{margin:6px 0 0;font-size:13px;color:#667085;font-weight:500}

  .tabs{
    display:flex;gap:4px;margin-bottom:16px;
    background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:4px;box-shadow:var(--shadow);
    overflow-x:auto;-webkit-overflow-scrolling:touch;
  }
  .tab{
    flex:1 1 auto;min-width:max-content;
    padding:10px 16px;border:none;background:transparent;
    font-size:14px;font-weight:600;color:#667085;
    border-radius:8px;cursor:pointer;white-space:nowrap;
    transition:background .15s,color .15s;
  }
  .tab:hover{background:#f0f4f9;color:#1f2430}
  .tab.active{background:var(--accent);color:#fff}
  body.layout-mobile .tab{font-size:15px;padding:12px 14px}

  .panel{display:none}
  .panel.active{display:block}

  .sortbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
  .sortbar label{font-size:13px;color:#475467;font-weight:500}
  .sortbar select{
    padding:8px 10px;border:1px solid var(--border);border-radius:8px;
    background:var(--card);font-size:14px;color:var(--text);
    outline:none;cursor:pointer;max-width:100%;flex:1 1 160px;
  }
  .sortbar .dir{
    padding:8px 10px;border:1px solid var(--border);border-radius:8px;
    background:var(--card);font-size:13px;cursor:pointer;white-space:nowrap;
  }

  /* Les deux vues sont visibles par défaut, les classes layout-* décident */
  .cards, .table-wrap { display:block; }
  .cards-grid{display:grid;grid-template-columns:1fr;gap:12px}

  .card{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px 18px;display:flex;flex-direction:column;gap:8px;
  }
  .card h3{margin:0;font-size:15px;font-weight:600;color:#344054}
  .card .value{
    font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;
    letter-spacing:-0.5px;line-height:1.1;
  }
  .card .bar{width:100%;height:6px;background:#eef1f6;border-radius:3px;overflow:hidden}
  .card .bar span{display:block;height:100%;border-radius:3px;transition:width .4s ease}
  .card.high .value{color:var(--success)}
  .card.high .bar span{background:var(--success)}
  .card.mid .value{color:var(--warning)}
  .card.mid .bar span{background:var(--warning)}
  .card.low .value{color:var(--danger)}
  .card.low .bar span{background:var(--danger)}
  .card.unknown .value{color:var(--muted);font-weight:500}

  .card.detail h3{color:var(--accent);margin-bottom:8px;font-size:16px}
  .card.detail .row{
    display:grid;grid-template-columns:1fr auto;align-items:center;
    gap:12px;padding:8px 0;border-bottom:1px dashed var(--border);
    font-size:14px;
  }
  .card.detail .row:last-child{border-bottom:none}
  .card.detail .row .k{color:#475467;font-size:13.5px;min-width:0;word-break:break-word}
  .card.detail .row .v{
    text-align:right;font-weight:700;color:var(--accent);
    font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px;
  }
  .card.detail .row .v.empty{color:var(--muted);font-weight:500}

  .table-wrap{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);
    overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;
  }
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:0}
  thead th{
    position:sticky;top:0;background:var(--accent);color:#fff;
    text-align:left;padding:10px 12px;font-weight:600;
    white-space:nowrap;cursor:pointer;user-select:none;
  }
  thead th:hover{background:#1558b0}
  thead th:not(:first-child){text-align:right}
  thead th .arrow{display:inline-block;margin-left:6px;opacity:.4;font-size:11px}
  thead th.sorted .arrow{opacity:1}
  tbody td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:top;word-break:break-word}
  tbody td:first-child{font-weight:600;color:#344054}
  tbody td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
  tbody td.empty{color:var(--muted);font-weight:400}
  tbody tr:nth-child(even){background:#fafbfd}
  tbody tr:hover{background:#eef4ff}

  .loading{
    text-align:center;padding:30px 16px;color:var(--muted);font-size:15px;
    display:flex;align-items:center;justify-content:center;gap:12px;
  }
  .loading .spin{
    width:18px;height:18px;border:2px solid var(--border);
    border-top-color:var(--accent);border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .empty-msg{text-align:center;padding:30px;color:var(--muted);font-size:14px}

  /* ============================================================
     MODE MOBILE : cartes seulement
     ============================================================ */
  body.layout-mobile .wrap{padding:14px}
  body.layout-mobile .header{padding:18px 16px;margin-bottom:16px}
  body.layout-mobile .header h1{font-size:22px}
  body.layout-mobile .header .subtitle{font-size:15px;margin-top:8px}
  body.layout-mobile .sortbar{gap:10px;margin-bottom:16px}
  body.layout-mobile .sortbar label{font-size:15px}
  body.layout-mobile .sortbar select{font-size:16px;padding:10px 12px}
  body.layout-mobile .sortbar .dir{font-size:15px;padding:10px 12px}

  body.layout-mobile .cards{display:block}
  body.layout-mobile .table-wrap{display:none}
  body.layout-mobile .card{padding:16px 18px}
  body.layout-mobile .card .value{font-size:32px}
  body.layout-mobile .card .row{grid-template-columns:1fr auto;gap:14px;padding:12px 0}
  body.layout-mobile .card .row .k{font-size:14.5px;line-height:1.35}
  body.layout-mobile .card .row .v{font-size:16px}

  /* ============================================================
     MODE TABLETTE : cartes, 2 colonnes
     ============================================================ */
  body.layout-tablet .wrap{padding:16px}
  body.layout-tablet .header{padding:22px 18px}
  body.layout-tablet .header h1{font-size:24px}
  body.layout-tablet .header .subtitle{font-size:15px}
  body.layout-tablet .cards{display:block}
  body.layout-tablet .table-wrap{display:none}
  body.layout-tablet .cards-grid{grid-template-columns:repeat(2,1fr);gap:14px}
  body.layout-tablet .card .value{font-size:30px}

  /* ============================================================
     MODE DESKTOP : tableau pour l'onglet 2, cartes pour l'onglet 1
     ============================================================ */
  body.layout-desktop .wrap{padding:20px}
  body.layout-desktop .header{padding:28px 24px}
  body.layout-desktop .header h1{font-size:24px}
  body.layout-desktop .header .subtitle{font-size:15px}
  body.layout-desktop .sortbar{display:none}

  /* Onglet 1 (satisfaction) : cartes en grille */
  body.layout-desktop #panel-sat .cards{display:block}
  body.layout-desktop #panel-sat .cards-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}

  /* Onglet 2 (complet) : cartes cachées, tableau visible */
  body.layout-desktop #panel-full .cards{display:none}
  body.layout-desktop #panel-full .table-wrap{display:block}
</style>
</head>
<body>

<div class="wrap">
  <header class="header">
    <img class="banner"
      src="https://www.lyceemaritime-boulogne.com/application/themes/theme_simpleo_coteo/images/logo-lycee-maritime-boulogne.jpg"
      alt="Lycée Maritime Boulogne">
    <h1>Lycée Professionnel Maritime Boulogne - Le Portel</h1>
    <p class="subtitle">Formations FC — Évaluation à chaud des formations</p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="sat" role="tab">Taux de satisfaction</button>
    <button class="tab" data-tab="full" role="tab">Évaluation complète</button>
  </div>

  <div class="panel active" id="panel-sat">
    <div class="loading" id="loading1">
      <div class="spin"></div>
      <div>Chargement des taux de satisfaction…</div>
    </div>
    <div class="cards" id="cards1" style="display:none">
      <div class="cards-grid" id="grid1"></div>
    </div>
    <div class="empty-msg" id="empty1" style="display:none">Aucune donnée de satisfaction disponible</div>
  </div>

  <div class="panel" id="panel-full">
    <div class="sortbar" id="sortbar2" style="display:none">
      <label for="sortSelect2">Trier par :</label>
      <select id="sortSelect2"></select>
      <button class="dir" id="sortDir2" type="button">▲ Croissant</button>
    </div>
    <div class="loading" id="loading2">
      <div class="spin"></div>
      <div>Chargement du détail…</div>
    </div>
    <div class="cards" id="cards2" style="display:none"></div>
    <div class="table-wrap" id="tableWrap2" style="display:none">
      <table id="table2"></table>
    </div>
    <div class="empty-msg" id="empty2" style="display:none">Aucune donnée détaillée disponible</div>
  </div>
</div>

<script>
  /* ============================================================
     1) LAYOUT
     ============================================================ */
  function applyLayout(){
    var w = Math.min(window.innerWidth||9999, document.documentElement.clientWidth||9999, screen.width||9999);
    document.body.classList.remove('layout-mobile','layout-tablet','layout-desktop');
    if (w < 700)       document.body.classList.add('layout-mobile');
    else if (w < 1000) document.body.classList.add('layout-tablet');
    else               document.body.classList.add('layout-desktop');
  }
  applyLayout();
  window.addEventListener('resize', applyLayout);
  window.addEventListener('orientationchange', () => setTimeout(applyLayout, 200));
  setTimeout(applyLayout, 300);
  setTimeout(applyLayout, 1000);

  /* ============================================================
     2) CONFIGURATION
     ============================================================ */
  const API_URL = "https://script.google.com/macros/s/AKfycbwVuwo3yEPlBB3dgH5b6eG1F0MbgkQQk3TECsexJ_PnH6iPIAegZ3ZIZ3A10D_s2c8u/exec";
  const CACHE_KEY = 'formations-all-v1';
  const CACHE_MAX_AGE_MS = 5 * 60 * 1000;

  /* ============================================================
     3) UTILITAIRES
     ============================================================ */
  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  function lireCache(){
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (Date.now() - obj.time > CACHE_MAX_AGE_MS) return null;
      return obj.data;
    } catch(e){ return null; }
  }
  function ecrireCache(data){
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ time: Date.now(), data })); } catch(e){}
  }

  /* ============================================================
     4) ONGLETS
     ============================================================ */
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
      document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + t.dataset.tab));
      // Forcer l'affichage du conteneur correspondant au layout actuel
      setTimeout(() => {
        const isDesk = document.body.classList.contains('layout-desktop');
        const $tw = document.getElementById('tableWrap2');
        const $c  = document.getElementById('cards2');
        if ($tw) $tw.style.display = isDesk ? 'block' : 'none';
        if ($c)  $c.style.display  = isDesk ? 'none'  : 'grid';
      }, 50);
    });
  });

  /* ============================================================
     5) SATISFACTION
     ============================================================ */
  function level(n){
    if (n == null) return 'unknown';
    if (n >= 75) return 'high';
    if (n >= 50) return 'mid';
    return 'low';
  }

  function renderSatisfaction(rows){
    const $loading = document.getElementById('loading1');
    const $cards   = document.getElementById('cards1');
    const $grid    = document.getElementById('grid1');
    const $empty   = document.getElementById('empty1');

    if (!Array.isArray(rows) || !rows.length){
      $loading.style.display = 'none';
      $empty.style.display = 'block';
      return;
    }
    $grid.innerHTML = rows.map(d => {
      const lvl = level(d.numeric);
      const pct = d.numeric != null ? Math.max(0, Math.min(100, d.numeric)) : 0;
      const bar = d.numeric != null ? '<div class="bar"><span style="width:'+pct+'%"></span></div>' : '';
      return '<div class="card '+lvl+'">' +
               '<h3>'+esc(d.name || d.code || '')+'</h3>' +
               '<div class="value">'+esc(d.value || '—')+'</div>' +
               bar +
             '</div>';
    }).join('');
    $loading.style.display = 'none';
    $cards.style.display = 'block';
    $empty.style.display = 'none';
  }

  /* ============================================================
     6) DÉTAIL COMPLET
     ============================================================ */
  let DATA2 = { indicators: [], rows: [] };
  let sortKey2 = 'name';
  let sortAsc2 = true;

  function getValue2(row, key){
    if (key === 'name') return row.name.toLowerCase();
    const i = parseInt(key.replace('col',''), 10);
    const c = row.cells[i];
    if (c.empty) return null;
    return c.num != null ? c.num : c.value.toLowerCase();
  }
  function sortRows2(rows){
    return rows.slice().sort((a, b) => {
      const va = getValue2(a, sortKey2), vb = getValue2(b, sortKey2);
      if (va === null && vb === null) return 0;
      if (va === null) return 1;
      if (vb === null) return -1;
      if (typeof va === 'number' && typeof vb === 'number'){
        return sortAsc2 ? va - vb : vb - va;
      }
      const sa = String(va), sb = String(vb);
      return sortAsc2 ? sa.localeCompare(sb,'fr') : sb.localeCompare(sa,'fr');
    });
  }

  function renderComplet(){
    const $loading   = document.getElementById('loading2');
    const $cards     = document.getElementById('cards2');
    const $table     = document.getElementById('table2');
    const $tableWrap = document.getElementById('tableWrap2');
    const $empty     = document.getElementById('empty2');
    const $sortbar   = document.getElementById('sortbar2');

    if (!DATA2.rows || !DATA2.rows.length){
      $loading.style.display = 'none';
      $empty.style.display = 'block';
      return;
    }
    const rows = sortRows2(DATA2.rows);

    const thead = '<thead><tr>' +
      '<th data-key="name" class="'+(sortKey2==='name'?'sorted':'')+'">Formation' +
      '<span class="arrow">'+(sortKey2==='name'?(sortAsc2?'▲':'▼'):'▲')+'</span></th>' +
      DATA2.indicators.map((h, i) => {
        const k = 'col'+i;
        const cls = sortKey2===k ? 'sorted' : '';
        const arr = sortKey2===k ? (sortAsc2?'▲':'▼') : '▲';
        return '<th data-key="'+k+'" class="'+cls+'">'+esc(h)+
               '<span class="arrow">'+arr+'</span></th>';
      }).join('') + '</tr></thead>';

    const tbody = '<tbody>' + rows.map(r =>
      '<tr><td>'+esc(r.name)+'</td>' +
      r.cells.map(c => '<td class="'+(c.empty?'empty':'')+'">'+esc(c.value)+'</td>').join('') +
      '</tr>'
    ).join('') + '</tbody>';

    $table.innerHTML = thead + tbody;

    $cards.innerHTML = rows.map(r => {
      const items = DATA2.indicators.map((label, i) => {
        const c = r.cells[i];
        return '<div class="row"><span class="k">'+esc(label)+'</span>' +
               '<span class="v'+(c.empty?' empty':'')+'">'+esc(c.value)+'</span></div>';
      }).join('');
      return '<div class="card detail"><h3>'+esc(r.name)+'</h3>'+items+'</div>';
    }).join('');

    $table.querySelectorAll('thead th').forEach(th => {
      th.addEventListener('click', () => {
        const k = th.dataset.key;
        if (k === sortKey2) sortAsc2 = !sortAsc2;
        else { sortKey2 = k; sortAsc2 = true; }
        renderComplet();
      });
    });

    // Affichage final : on décide selon le layout actuel
    const isDesk = document.body.classList.contains('layout-desktop');
    $loading.style.display = 'none';
    $empty.style.display = 'none';
    $sortbar.style.display = isDesk ? 'none' : 'flex';
    $tableWrap.style.display = isDesk ? 'block' : 'none';
    $cards.style.display    = isDesk ? 'none'  : 'grid';
  }

  function initSortBar2(){
    const $select = document.getElementById('sortSelect2');
    const $dirBtn = document.getElementById('sortDir2');
    if (!$select) return;
    $select.innerHTML = '';
    const cols = [{ key: 'name', label: 'Formation' },
      ...DATA2.indicators.map((h, i) => ({ key: 'col'+i, label: h }))];
    cols.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.key;
      opt.textContent = c.label;
      $select.appendChild(opt);
    });
    $select.value = sortKey2;

    if (!$select.dataset.bound){
      $select.addEventListener('change', () => {
        sortKey2 = $select.value;
        sortAsc2 = true;
        renderComplet();
      });
      $select.dataset.bound = '1';
    }
    if ($dirBtn && !$dirBtn.dataset.bound){
      $dirBtn.addEventListener('click', () => {
        sortAsc2 = !sortAsc2;
        renderComplet();
      });
      $dirBtn.dataset.bound = '1';
    }
  }

  /* ============================================================
     7) RENDU GLOBAL
     ============================================================ */
  function renderAll(payload){
    if (!payload){
      document.getElementById('loading1').style.display = 'none';
      document.getElementById('loading2').style.display = 'none';
      document.getElementById('empty1').style.display = 'block';
      document.getElementById('empty2').style.display = 'block';
      return;
    }
    renderSatisfaction(payload.satisfaction || []);
    if (payload.complet && payload.complet.rows){
      DATA2 = payload.complet;
      initSortBar2();
      renderComplet();
    } else {
      document.getElementById('loading2').style.display = 'none';
      document.getElementById('empty2').style.display = 'block';
    }
  }

  /* ============================================================
     8) CHARGEMENT VIA JSONP
     ============================================================ */
  let jsonpCounter = 0;

  function chargerViaJSONP(url){
    return new Promise((resolve, reject) => {
      const cbName = 'jsonpCallback_' + (++jsonpCounter) + '_' + Date.now();
      const script = document.createElement('script');
      const timeout = setTimeout(() => {
        cleanup();
        reject(new Error('Timeout de la requête'));
      }, 25000);

      function cleanup(){
        clearTimeout(timeout);
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      window[cbName] = function(data){
        cleanup();
        resolve(data);
      };

      script.onerror = function(){
        cleanup();
        reject(new Error('Erreur réseau'));
      };

      script.src = url + (url.indexOf('?') === -1 ? '?' : '&') + 'callback=' + cbName;
      document.body.appendChild(script);
    });
  }

  async function chargerTout(){
    const cached = lireCache();
    if (cached){
      renderAll(cached);
    }

    try {
      const data = await chargerViaJSONP(API_URL);
      if (!data || data.error){
        throw new Error(data && data.error ? data.error : 'Réponse vide');
      }
      ecrireCache(data);
      renderAll(data);
      console.log("API OK —",
        (data.satisfaction||[]).length, "satisfactions,",
        (data.complet && data.complet.rows || []).length, "lignes détail");
    } catch (e) {
      console.error("Erreur chargement:", e);
      if (!cached){
        document.getElementById('loading1').style.display = 'none';
        document.getElementById('loading2').style.display = 'none';
        document.getElementById('empty1').textContent = "Impossible de charger : " + e.message;
        document.getElementById('empty1').style.display = 'block';
        document.getElementById('empty2').textContent = "Impossible de charger : " + e.message;
        document.getElementById('empty2').style.display = 'block';
      }
    }
  }

  chargerTout();
</script>
</body>
</html>
