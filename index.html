<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lycée Professionnel Maritime Boulogne - Le Portel</title>
<style>
  :root{
    --accent:#1a73e8;--accent-soft:#e8f0fe;--bg:#f6f8fb;--card:#ffffff;
    --text:#1f2430;--muted:#98a2b3;--border:#e6e9ef;--radius:14px;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 16px rgba(16,24,40,.07);
    --success:#0f9d58;--warning:#f4b400;--danger:#d93025;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    width:100%;max-width:100%;overflow-x:hidden}

  .wrap{width:100%;max-width:1200px;margin:0 auto;padding:12px;overflow-x:hidden}

  .header{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px 14px;margin-bottom:14px;text-align:center;
    max-width:100%;word-wrap:break-word;
  }
  .header .banner{
    display:block;margin:0 auto 12px;
    max-width:600px;width:100%;height:auto;
  }
  .header h1{margin:0;font-size:18px;font-weight:700;line-height:1.3;word-wrap:break-word}
  .header .subtitle{margin:6px 0 0;font-size:13px;color:#667085;font-weight:500}

  /* Cartes */
  .cards{display:grid;grid-template-columns:1fr;gap:12px}
  .card{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px 18px;max-width:100%;word-wrap:break-word;
    display:flex;flex-direction:column;gap:10px;
    transition:transform .15s, box-shadow .15s;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(16,24,40,.08),0 12px 28px rgba(16,24,40,.10)}
  .card h3{
    margin:0;font-size:16px;font-weight:600;color:#344054;
    line-height:1.35;word-break:break-word;
  }
  .card .value{
    font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;
    letter-spacing:-0.5px;line-height:1.1;
  }
  .card .bar{
    width:100%;height:6px;background:#eef1f6;border-radius:3px;
    overflow:hidden;
  }
  .card .bar span{
    display:block;height:100%;border-radius:3px;
    transition:width .4s ease;
  }
  .card.high .value{color:var(--success)}
  .card.high .bar span{background:var(--success)}
  .card.mid .value{color:var(--warning)}
  .card.mid .bar span{background:var(--warning)}
  .card.low .value{color:var(--danger)}
  .card.low .bar span{background:var(--danger)}
  .card.unknown .value{color:var(--muted);font-weight:500}

  /* Loader */
  .loading{
    text-align:center;padding:40px 16px;color:var(--muted);font-size:15px;
    display:flex;align-items:center;justify-content:center;gap:12px;
  }
  .loading .spin{
    width:18px;height:18px;border:2px solid var(--border);
    border-top-color:var(--accent);border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .empty-msg{text-align:center;padding:40px;color:var(--muted)}

  /* MODE MOBILE */
  body.layout-mobile .wrap{padding:14px}
  body.layout-mobile .header{padding:18px 16px 16px;margin-bottom:16px}
  body.layout-mobile .header h1{font-size:22px;line-height:1.3}
  body.layout-mobile .header .subtitle{font-size:15px;margin-top:8px}
  body.layout-mobile .header .banner{margin-bottom:14px}
  body.layout-mobile .cards{gap:12px}
  body.layout-mobile .card{padding:18px 18px}
  body.layout-mobile .card h3{font-size:18px;margin-bottom:4px}
  body.layout-mobile .card .value{font-size:32px}

  /* MODE TABLETTE */
  body.layout-tablet .cards{grid-template-columns:repeat(2,1fr)}
  body.layout-tablet .wrap{padding:16px}
  body.layout-tablet .header{padding:22px 18px}
  body.layout-tablet .header h1{font-size:24px}
  body.layout-tablet .header .subtitle{font-size:15px}
  body.layout-tablet .card h3{font-size:17px}
  body.layout-tablet .card .value{font-size:30px}

  /* MODE DESKTOP */
  body.layout-desktop .wrap{padding:20px}
  body.layout-desktop .cards{grid-template-columns:repeat(auto-fill, minmax(220px,1fr))}
  body.layout-desktop .header{padding:28px 24px 24px}
  body.layout-desktop .header h1{font-size:24px}
  body.layout-desktop .header .subtitle{font-size:15px}
</style>
</head>
<body>

<script>
  (function(){
    function applyLayout(){
      var w = Math.min(
        window.innerWidth || 9999,
        document.documentElement.clientWidth || 9999,
        screen.width || 9999
      );
      document.body.classList.remove('layout-mobile','layout-tablet','layout-desktop');
      if (w < 700)       document.body.classList.add('layout-mobile');
      else if (w < 1000) document.body.classList.add('layout-tablet');
      else               document.body.classList.add('layout-desktop');
    }
    applyLayout();
    window.addEventListener('resize', applyLayout);
    window.addEventListener('orientationchange', function(){
      setTimeout(applyLayout, 200);
    });
  })();
</script>

<div class="wrap">

  <header class="header">
    <img class="banner"
      src="https://www.lyceemaritime-boulogne.com/application/themes/theme_simpleo_coteo/images/logo-lycee-maritime-boulogne.jpg"
      alt="Lycée Maritime Boulogne">
    <h1>Lycée Professionnel Maritime Boulogne - Le Portel</h1>
    <p class="subtitle">Formations FC — Taux de satisfaction par formation</p>
  </header>

  <div class="loading" id="loading">
    <div class="spin"></div>
    <div>Chargement des données…</div>
  </div>

  <div class="cards" id="cards" style="display:none"></div>
  <div class="empty-msg" id="empty" style="display:none">Aucune donnée disponible</div>
</div>

<script>
  /* ============================================================
     ⚙️ CONFIGURATION
     ============================================================ */
  const API_URL = "https://script.google.com/macros/s/AKfycbziTiSbC36BjmwUSjJky6VJg91Amn1xCYc8fScu64qjbTHvVIDkfrc-G9O2NOCp_FrIhQ/exec";

  const CACHE_KEY = 'formations-cache-v3';
  const CACHE_MAX_AGE_MS = 5 * 60 * 1000; // 5 minutes

  /* ============================================================
     DOM
     ============================================================ */
  const $loading = document.getElementById('loading');
  const $cards   = document.getElementById('cards');
  const $empty   = document.getElementById('empty');

  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  /* ============================================================
     CACHE LOCAL
     ============================================================ */
  function lireCache(){
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (Date.now() - obj.time > CACHE_MAX_AGE_MS) return null;
      return obj.data;
    } catch(e){ return null; }
  }
  function ecrireCache(data){
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ time: Date.now(), data }));
    } catch(e){}
  }

  /* ============================================================
     RENDU
     ============================================================ */
  function level(n){
    if (n === null || n === undefined) return 'unknown';
    if (n >= 75) return 'high';
    if (n >= 50) return 'mid';
    return 'low';
  }

  function render(rows){
    if (!Array.isArray(rows) || !rows.length){
      $loading.style.display = 'none';
      $empty.style.display = 'block';
      return;
    }
    $cards.innerHTML = rows.map(d => {
      const lvl = level(d.numeric);
      const pct = d.numeric !== null && d.numeric !== undefined
        ? Math.max(0, Math.min(100, d.numeric)) : 0;
      const bar = (d.numeric !== null && d.numeric !== undefined)
        ? '<div class="bar"><span style="width:'+pct+'%"></span></div>' : '';
      return '<div class="card '+lvl+'">' +
               '<h3>'+esc(d.name || d.code || '')+'</h3>' +
               '<div class="value">'+esc(d.value || '—')+'</div>' +
               bar +
             '</div>';
    }).join('');

    $loading.style.display = 'none';
    $cards.style.display = 'grid';
    $empty.style.display = 'none';
  }

  /* ============================================================
     CHARGEMENT DES DONNÉES
     ============================================================ */
  async function chargerDonnees(){
    /* 1) Affichage immédiat si cache récent */
    const cached = lireCache();
    if (cached && Array.isArray(cached) && cached.length){
      render(cached);
    }

    /* 2) Rafraîchissement via l'API */
    try {
      const response = await fetch(API_URL, { cache: 'no-store' });
      if (!response.ok) throw new Error('Erreur réseau');
      const data = await response.json();

      if (!Array.isArray(data)){
        console.error("Réponse API invalide:", data);
        if (!cached){
          $loading.style.display = 'none';
          $empty.textContent = "Erreur de chargement des données.";
          $empty.style.display = 'block';
        }
        return;
      }

      ecrireCache(data);
      render(data);

    } catch (error) {
      console.error("Erreur de chargement:", error);
      if (!cached){
        $loading.style.display = 'none';
        $empty.textContent = "Impossible de charger les données.";
        $empty.style.display = 'block';
      }
    }
  }

  chargerDonnees();
</script>
</body>
</html>
