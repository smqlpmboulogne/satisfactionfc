<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lycée Professionnel Maritime Boulogne - Le Portel</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --accent:#1a73e8;--bg:#f6f8fb;--card:#ffffff;
    --text:#1f2430;--muted:#98a2b3;--border:#e6e9ef;--radius:14px;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 16px rgba(16,24,40,.07);
    --success:#0f9d58;--warning:#f4b400;--danger:#d93025;
  }
  *{box-sizing:border-box}
  html, body {
    margin:0; padding:0;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    width:100%; max-width:100%; overflow-x:hidden;
  }
  .wrap{width:100%;max-width:1200px;margin:0 auto;padding:12px;overflow-x:hidden}

  .header{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px 14px;margin-bottom:14px;text-align:center;
  }
  .header .banner{
    display:block;margin:0 auto 12px;
    max-width:600px;width:100%;height:auto;
  }
  .header h1{margin:0;font-size:18px;font-weight:700;line-height:1.3}
  .header .subtitle{margin:6px 0 0;font-size:13px;color:#667085;font-weight:500}

  .cards-grid{display:grid;grid-template-columns:1fr;gap:12px}

  .card{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px 18px;display:flex;flex-direction:column;gap:8px;
    transition:transform .15s, box-shadow .15s;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(16,24,40,.08),0 12px 28px rgba(16,24,40,.10)}
  .card h3{margin:0;font-size:15px;font-weight:600;color:#344054;word-break:break-word}
  .card .value{
    font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;
    letter-spacing:-0.5px;line-height:1.1;
  }
  .card .bar{width:100%;height:6px;background:#eef1f6;border-radius:3px;overflow:hidden}
  .card .bar span{display:block;height:100%;border-radius:3px;transition:width .4s ease}

  .card.high .value{color:var(--success)}
  .card.high .bar span{background:var(--success)}
  .card.mid .value{color:var(--warning)}
  .card.mid .bar span{background:var(--warning)}
  .card.low .value{color:var(--danger)}
  .card.low .bar span{background:var(--danger)}
  .card.unknown .value{color:var(--muted);font-weight:500}

  .loading{
    text-align:center;padding:40px 16px;color:var(--muted);font-size:15px;
    display:flex;align-items:center;justify-content:center;gap:12px;
  }
  .loading .spin{
    width:20px;height:20px;border:2px solid var(--border);
    border-top-color:var(--accent);border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .empty-msg{text-align:center;padding:40px;color:var(--muted);font-size:14px}

  body.layout-mobile .wrap{padding:14px}
  body.layout-mobile .header{padding:18px 16px;margin-bottom:16px}
  body.layout-mobile .header h1{font-size:22px}
  body.layout-mobile .header .subtitle{font-size:15px;margin-top:8px}
  body.layout-mobile .card{padding:18px}
  body.layout-mobile .card h3{font-size:17px}
  body.layout-mobile .card .value{font-size:32px}

  body.layout-tablet .wrap{padding:16px}
  body.layout-tablet .header{padding:22px 18px}
  body.layout-tablet .header h1{font-size:24px}
  body.layout-tablet .header .subtitle{font-size:15px}
  body.layout-tablet .cards-grid{grid-template-columns:repeat(2,1fr);gap:14px}
  body.layout-tablet .card h3{font-size:16px}
  body.layout-tablet .card .value{font-size:30px}

  body.layout-desktop .wrap{padding:20px}
  body.layout-desktop .header{padding:28px 24px}
  body.layout-desktop .header h1{font-size:24px}
  body.layout-desktop .header .subtitle{font-size:15px}
  body.layout-desktop .cards-grid{
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:16px;
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="header">
    <img class="banner"
      src="https://www.lyceemaritime-boulogne.com/application/themes/theme_simpleo_coteo/images/logo-lycee-maritime-boulogne.jpg"
      alt="Lycée Maritime Boulogne">
    <h1>Lycée Professionnel Maritime Boulogne - Le Portel</h1>
    <p class="subtitle">Formations FC — Taux de satisfaction par formation</p>
  </header>

  <div class="loading" id="loading">
    <div class="spin"></div>
    <div>Chargement des données…</div>
  </div>

  <div class="cards-grid" id="grid" style="display:none"></div>
  <div class="empty-msg" id="empty" style="display:none">Aucune donnée disponible</div>
</div>

<script>
  /* ============================================================
     1) DÉTECTION DU LAYOUT
     ============================================================ */
  function applyLayout(){
    var w = Math.min(
      window.innerWidth || 9999,
      document.documentElement.clientWidth || 9999,
      screen.width || 9999
    );
    document.body.classList.remove('layout-mobile','layout-tablet','layout-desktop');
    if (w < 700)       document.body.classList.add('layout-mobile');
    else if (w < 1000) document.body.classList.add('layout-tablet');
    else               document.body.classList.add('layout-desktop');
  }
  applyLayout();
  window.addEventListener('resize', applyLayout);
  window.addEventListener('orientationchange', () => setTimeout(applyLayout, 200));
  setTimeout(applyLayout, 300);
  setTimeout(applyLayout, 1000);

  /* ============================================================
     2) CONFIGURATION — CSV publié, aucune authentification
     ============================================================ */
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQmr4PCIaLG4QmtwpvNk5suRMfYuRpF1-o5Sf022BIXPYkdMbMxXZxchwxh06cnhLBzu2epcxeO7ouG/pub?output=csv";
  const CACHE_KEY = 'formations-satisfaction-v2';
  const CACHE_MAX_AGE_MS = 5 * 60 * 1000;

  /* Correspondance code → intitulé exact */
  const FORMATION_NAMES = {
    "CMP":          "Certificat Matelot Pont",
    "Meca750":      "Mécanicien 750 Kw",
    "Meca250":      "Mécanicien 250 Kw",
    "C200":         "Capitaine 200",
    "RecyCap2000":  "Recyclage Capitaine 200",
    "ModPeche":     "Module Pêche",
    "CAEERSini":    "CAEERS Initial",
    "RecyCAEERS":   "Recyclage CAEERS",
    "CFBS":         "CFBS",
    "RecyCFBS":     "Recyclage CFBS",
    "CSS":          "CSS",
    "RecyMed1":     "Recyclage Médical 1",
    "CRO":          "CRO",
    "CGO":          "CGO",
    "RecyCRO":      "Recyclage CRO",
    "RecyCGO":      "Recyclage CGO",
    "Med2":         "Médical 2",
    "RecyMed2":     "Recyclage Médical 2",
    "NavPaxNOff":   "NavPax Non Officier",
    "NavPaxOff":    "NavPax Officier",
    "C500":         "Capitaine 500"
  };

  const $loading = document.getElementById('loading');
  const $grid    = document.getElementById('grid');
  const $empty   = document.getElementById('empty');

  /* ============================================================
     3) UTILITAIRES
     ============================================================ */
  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  function level(n){
    if (n == null) return 'unknown';
    if (n >= 75) return 'high';
    if (n >= 50) return 'mid';
    return 'low';
  }

  function lireCache(){
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (Date.now() - obj.time > CACHE_MAX_AGE_MS) return null;
      return obj.data;
    } catch(e){ return null; }
  }
  function ecrireCache(data){
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ time: Date.now(), data })); } catch(e){}
  }

  /* ============================================================
     4) PARSING DU CSV
     ============================================================ */
  function parseCSVLine(line){
    const out = [];
    let cur = "";
    let inQuotes = false;
    for (let i = 0; i < line.length; i++){
      const c = line[i];
      if (c === '"'){
        if (inQuotes && line[i+1] === '"'){ cur += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if (c === ',' && !inQuotes){
        out.push(cur); cur = "";
      } else {
        cur += c;
      }
    }
    out.push(cur);
    return out;
  }

  function parseCSV(text){
    const lines = text.replace(/\r/g, "").split("\n").filter(l => l.trim() !== "");
    if (!lines.length) return [];
    const headers = parseCSVLine(lines[0]).map(h => h.trim());
    const satIdx = headers.findIndex(h => /satisfaction/i.test(h));
    const idx = satIdx === -1 ? headers.length - 1 : satIdx;

    const isError = v => /^#(DIV\/0!|N\/A|VALUE!|REF!|NAME\?|NUM!|NULL!)/i.test(v);

    const rows = [];
    for (let i = 1; i < lines.length; i++){
      const cols = parseCSVLine(lines[i]);
      const code = (cols[0] || "").trim();
      if (!code) continue;

      const raw = (cols[idx] || "").trim();
      if (!raw || isError(raw)) continue;

      const cleaned = raw.replace("%","").replace(",",".").replace(/\s/g,"");
      const numeric = parseFloat(cleaned);
      if (isNaN(numeric)) continue;

      rows.push({
        code,
        name: FORMATION_NAMES[code] || code,
        value: raw,
        numeric
      });
    }

    rows.sort((a, b) => b.numeric - a.numeric);
    return rows;
  }

  /* ============================================================
     5) RENDU
     ============================================================ */
  function render(rows){
    if (!Array.isArray(rows) || !rows.length){
      $loading.style.display = 'none';
      $empty.style.display = 'block';
      return;
    }
    $grid.innerHTML = rows.map(d => {
      const lvl = level(d.numeric);
      const pct = Math.max(0, Math.min(100, d.numeric));
      return '<div class="card '+lvl+'">' +
               '<h3>'+esc(d.name)+'</h3>' +
               '<div class="value">'+esc(d.value)+'</div>' +
               '<div class="bar"><span style="width:'+pct+'%"></span></div>' +
             '</div>';
    }).join('');

    $loading.style.display = 'none';
    $grid.style.display = 'grid';
    $empty.style.display = 'none';
  }

  /* ============================================================
     6) CHARGEMENT
     ============================================================ */
  async function chargerDonnees(){
    // 1) Affichage immédiat depuis le cache
    const cached = lireCache();
    if (cached && cached.length){
      render(cached);
    }

    // 2) Rafraîchissement depuis le CSV publié
    try {
      const response = await fetch(CSV_URL, { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const text = await response.text();
      const rows = parseCSV(text);
      if (!rows.length) throw new Error('Aucune donnée exploitable dans le CSV');
      ecrireCache(rows);
      render(rows);
      console.log("CSV OK —", rows.length, "formations");
    } catch (e) {
      console.error("Erreur chargement:", e);
      if (!cached){
        $loading.style.display = 'none';
        $empty.textContent = "Impossible de charger les données : " + e.message;
        $empty.style.display = 'block';
      }
    }
  }

  chargerDonnees();
</script>
</body>
</html>
