name: Sync CSV depuis Google Sheets

on:
  schedule:
    # Toutes les 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permet aussi de le lancer manuellement

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Télécharger le CSV depuis Google Sheets
        run: |
          curl -L -o formations.csv \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vQmr4PCIaLG4QmtwpvNk5suRMfYuRpF1-o5Sf022BIXPYkdMbMxXZxchwxh06cnhLBzu2epcxeO7ouG/pub?gid=0&single=true&output=csv"

      - name: Vérifier si le fichier a changé
        id: check
        run: |
          if git diff --quiet formations.csv; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit et push si changement
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add formations.csv
          git commit -m "Mise à jour automatique du CSV"
          git push
