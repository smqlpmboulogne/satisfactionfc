name: Sync CSV depuis Google Sheets

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Télécharger le CSV RESULTATS
        run: |
          curl -L -o formations.csv \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vQw8FcM4nLQtrdOgIDSlimdJ11UBuQ6MrBu3BmxNIUn54Jdk9somZAsPn4pB8kvGKhS0_g9yC4C0VeO/pub?gid=1012343994&single=true&output=csv"

      - name: Télécharger le CSV SUGGESTIONS
        run: |
          curl -L -o suggestions.csv \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vQw8FcM4nLQtrdOgIDSlimdJ11UBuQ6MrBu3BmxNIUn54Jdk9somZAsPn4pB8kvGKhS0_g9yC4C0VeO/pub?gid=1774868000&single=true&output=csv"

      - name: Télécharger le CSV REFUS
        run: |
          curl -L -o refus.csv \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vQw8FcM4nLQtrdOgIDSlimdJ11UBuQ6MrBu3BmxNIUn54Jdk9somZAsPn4pB8kvGKhS0_g9yC4C0VeO/pub?gid=252414659&single=true&output=csv"

      - name: Télécharger le CSV SYNTHESE
        run: |
          curl -L -o synthese.csv \
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vQw8FcM4nLQtrdOgIDSlimdJ11UBuQ6MrBu3BmxNIUn54Jdk9somZAsPn4pB8kvGKhS0_g9yC4C0VeO/pub?gid=1317312539&single=true&output=csv"

      - name: Écrire la date de mise à jour
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last-update.txt

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add formations.csv suggestions.csv refus.csv synthese.csv last-update.txt
          if git diff --cached --quiet; then
            echo "Aucun changement à commiter"
          else
            git commit -m "Mise à jour automatique des CSV"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
